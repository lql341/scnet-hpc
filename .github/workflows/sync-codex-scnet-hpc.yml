name: Sync codex-scnet-hpc

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "CHANGELOG.md"
      - "RELEASE_HIGHLIGHTS.md"
      - "RELEASE_HIGHLIGHTS_CN.md"
      - "SKILL.md"
      - "agents/**"
      - "clusters/**"
      - "references/**"
      - "scripts/**"
      - ".github/downstream/codex-release.yml"
      - ".github/scripts/release_docs.py"
      - ".github/workflows/sync-codex-scnet-hpc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scnet-hpc
        uses: actions/checkout@v7
        with:
          path: scnet-hpc
          fetch-depth: 0

      - name: Checkout codex-scnet-hpc
        uses: actions/checkout@v7
        with:
          repository: lql341/codex-scnet-hpc
          path: codex-scnet-hpc
          token: ${{ secrets.DSH_SCNET_PAT }}
          fetch-depth: 0

      - name: Synchronize canonical skill
        working-directory: codex-scnet-hpc
        run: |
          chmod +x sync.sh
          ./sync.sh --src ../scnet-hpc

      - name: Update downstream sync manifest
        working-directory: codex-scnet-hpc
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("sync.sh")
          text = path.read_text()
          required = (
              "setup.sh",
              "scnet.py",
              "scnet_config.py",
              "scnet_credentials.py",
              "scnet_version.py",
          )
          match = re.search(r"(for file in [^;\n]+)(; do)", text)
          if match:
              missing = [name for name in required if name not in match.group(1)]
              if missing:
                  replacement = match.group(1) + " " + " ".join(missing) + match.group(2)
                  text = text[:match.start()] + replacement + text[match.end():]
          marker = 'chmod +x "$DST/scripts/"*.sh "$DST/scripts/compute-probe.py"'
          additions = ""
          if 'cp -R "$SRC/scripts/scnet_backends"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_backends"\n'
                  'cp -R "$SRC/scripts/scnet_backends" "$DST/scripts/scnet_backends"\n'
              )
          if 'cp -R "$SRC/scripts/scnet_sdk"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_sdk"\n'
                  'cp -R "$SRC/scripts/scnet_sdk" "$DST/scripts/scnet_sdk"\n'
              )
          if marker in text and additions:
              text = text.replace(
                  marker,
                  additions + marker + '\nchmod +x "$DST/scripts/scnet.py"',
              )
          path.write_text(text)
          PY

      - name: Overlay canonical backend entrypoints
        working-directory: codex-scnet-hpc
        run: |
          cp ../scnet-hpc/VERSION plugins/scnet-hpc/skills/scnet-hpc/VERSION
          dst=plugins/scnet-hpc/skills/scnet-hpc/scripts
          cp ../scnet-hpc/scripts/setup.sh "$dst/setup.sh"
          cp ../scnet-hpc/scripts/scnet.py "$dst/scnet.py"
          cp ../scnet-hpc/scripts/scnet_config.py "$dst/scnet_config.py"
          cp ../scnet-hpc/scripts/scnet_credentials.py "$dst/scnet_credentials.py"
          cp ../scnet-hpc/scripts/scnet_version.py "$dst/scnet_version.py"
          rm -rf "$dst/scnet_backends"
          cp -R ../scnet-hpc/scripts/scnet_backends "$dst/scnet_backends"
          rm -rf "$dst/scnet_sdk"
          cp -R ../scnet-hpc/scripts/scnet_sdk "$dst/scnet_sdk"
          chmod +x "$dst/setup.sh" "$dst/scnet.py"
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = Path("../scnet-hpc/VERSION").read_text().strip()
          path = Path("plugins/scnet-hpc/.codex-plugin/plugin.json")
          plugin = json.loads(path.read_text())
          plugin["version"] = version
          path.write_text(json.dumps(plugin, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Align Codex release README
        working-directory: codex-scnet-hpc
        run: |
          cp ../scnet-hpc/CHANGELOG.md CHANGELOG.md
          cp ../scnet-hpc/RELEASE_HIGHLIGHTS.md RELEASE_HIGHLIGHTS.md
          cp ../scnet-hpc/RELEASE_HIGHLIGHTS_CN.md RELEASE_HIGHLIGHTS_CN.md
          mkdir -p .github/scripts
          cp ../scnet-hpc/.github/scripts/release_docs.py .github/scripts/release_docs.py
          cp ../scnet-hpc/.github/downstream/codex-release.yml .github/workflows/release.yml
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": (
                  "Updates to canonical Skill content are synchronized through an automated pull request. "
                  "The target repository validates synchronization, shell and Python syntax, Plugin metadata, "
                  "and repository hygiene before merge.",
                  "Updates to canonical Skill content are synchronized through an automated pull request. "
                  "After the target validation passes, the workflow merges the PR and publishes the matching "
                  "Git tag and GitHub Release automatically.",
              ),
              "README_CN.md": (
                  "canonical Skill 内容更新后，会通过自动 workflow 创建同步 PR。合并前由目标仓库检查同步状态、Shell/Python 语法、Plugin 元数据和仓库卫生。",
                  "canonical Skill 内容更新后，会通过自动 workflow 创建同步 PR。目标仓库校验同步状态、"
                  "Shell/Python 语法、Plugin 元数据和仓库卫生；校验通过后自动合并，并发布对应的 "
                  "Git tag 与 GitHub Release。",
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          PY
          python3 .github/scripts/release_docs.py \
            --version-file plugins/scnet-hpc/skills/scnet-hpc/VERSION

      - name: Validate Codex plugin
        working-directory: codex-scnet-hpc
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plugin = json.loads(Path("plugins/scnet-hpc/.codex-plugin/plugin.json").read_text())
          assert plugin["name"] == "scnet-hpc"
          assert plugin["skills"] == "./skills/"
          version = Path("plugins/scnet-hpc/skills/scnet-hpc/VERSION").read_text().strip()
          assert version in Path("README.md").read_text()
          assert version in Path("README_CN.md").read_text()
          marketplace = json.loads(Path(".agents/plugins/marketplace.json").read_text())
          assert any(entry["name"] == "scnet-hpc" for entry in marketplace["plugins"])
          PY
          python3 .github/scripts/release_docs.py --check \
            --version-file plugins/scnet-hpc/skills/scnet-hpc/VERSION
          for script in plugins/scnet-hpc/skills/scnet-hpc/scripts/*.sh; do bash -n "$script"; done
          test -x plugins/scnet-hpc/skills/scnet-hpc/scripts/setup.sh
          python3 -m py_compile plugins/scnet-hpc/skills/scnet-hpc/scripts/*.py plugins/scnet-hpc/skills/scnet-hpc/scripts/scnet_sdk/*.py plugins/scnet-hpc/skills/scnet-hpc/scripts/scnet_backends/*.py
          git diff --check

      - name: Open sync pull request
        id: sync-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DSH_SCNET_PAT }}
          path: codex-scnet-hpc
          commit-message: "Sync scnet-hpc updates"
          branch: sync/scnet-hpc
          delete-branch: true
          title: "Sync scnet-hpc updates"
          body: |
            Automatically synchronized from lql341/scnet-hpc@${{ github.sha }}.

            The Codex skills-only Plugin wrapper and release metadata are generated from the canonical Skill repository.
            The workflow will merge this PR after the required target validation passes.

      - name: Validate and merge sync pull request
        if: steps.sync-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DSH_SCNET_PAT }}
          PR_URL: ${{ steps.sync-pr.outputs.pull-request-url }}
        run: |
          gh pr checks "$PR_URL" --required --watch --interval 10
          gh pr merge "$PR_URL" --merge --delete-branch

name: Sync dsh-scnet

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "CHANGELOG.md"
      - "RELEASE_HIGHLIGHTS.md"
      - "RELEASE_HIGHLIGHTS_CN.md"
      - "SKILL.md"
      - "clusters/**"
      - "references/**"
      - "scripts/**"
      - ".github/scripts/release_docs.py"
      - ".github/workflows/sync-dsh-scnet.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scnet-hpc
        uses: actions/checkout@v7
        with:
          path: scnet-hpc
          fetch-depth: 0

      - name: Checkout dsh-scnet
        uses: actions/checkout@v7
        with:
          repository: lql341/dsh-scnet
          path: dsh-scnet
          token: ${{ secrets.DSH_SCNET_PAT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync skill content into dsh-scnet
        working-directory: dsh-scnet
        run: |
          chmod +x sync.sh
          ./sync.sh --src ../scnet-hpc

      - name: Update downstream sync manifest
        working-directory: dsh-scnet
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("sync.sh")
          text = path.read_text()
          required = (
              "setup.sh",
              "scnet.py",
              "scnet_config.py",
              "scnet_credentials.py",
              "scnet_version.py",
          )
          match = re.search(r"(for f in [^;\n]+)(; do)", text)
          if match:
              missing = [name for name in required if name not in match.group(1)]
              if missing:
                  replacement = match.group(1) + " " + " ".join(missing) + match.group(2)
                  text = text[:match.start()] + replacement + text[match.end():]
          marker = 'chmod +x "$DST/scripts/"*.sh'
          additions = ""
          if 'cp -R "$SRC/scripts/scnet_backends"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_backends"\n'
                  'cp -R "$SRC/scripts/scnet_backends" "$DST/scripts/scnet_backends"\n'
              )
          if 'cp -R "$SRC/scripts/scnet_sdk"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_sdk"\n'
                  'cp -R "$SRC/scripts/scnet_sdk" "$DST/scripts/scnet_sdk"\n'
              )
          if marker in text and additions:
              text = text.replace(
                  marker,
                  additions + marker + '\nchmod +x "$DST/scripts/scnet.py"',
              )
          path.write_text(text)
          PY

      - name: Overlay canonical backend entrypoints
        working-directory: dsh-scnet
        run: |
          cp ../scnet-hpc/VERSION skills/scnet-hpc/VERSION
          dst=skills/scnet-hpc/scripts
          cp ../scnet-hpc/scripts/setup.sh "$dst/setup.sh"
          cp ../scnet-hpc/scripts/scnet.py "$dst/scnet.py"
          cp ../scnet-hpc/scripts/scnet_config.py "$dst/scnet_config.py"
          cp ../scnet-hpc/scripts/scnet_credentials.py "$dst/scnet_credentials.py"
          cp ../scnet-hpc/scripts/scnet_version.py "$dst/scnet_version.py"
          rm -rf "$dst/scnet_backends"
          cp -R ../scnet-hpc/scripts/scnet_backends "$dst/scnet_backends"
          rm -rf "$dst/scnet_sdk"
          cp -R ../scnet-hpc/scripts/scnet_sdk "$dst/scnet_sdk"
          chmod +x "$dst/setup.sh" "$dst/scnet.py"

      - name: Align package metadata with canonical version
        working-directory: dsh-scnet
        run: |
          cp ../scnet-hpc/CHANGELOG.md CHANGELOG.md
          cp ../scnet-hpc/RELEASE_HIGHLIGHTS.md RELEASE_HIGHLIGHTS.md
          cp ../scnet-hpc/RELEASE_HIGHLIGHTS_CN.md RELEASE_HIGHLIGHTS_CN.md
          mkdir -p .github/scripts
          cp ../scnet-hpc/.github/scripts/release_docs.py .github/scripts/release_docs.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = Path("../scnet-hpc/VERSION").read_text().strip()
          path = Path("package.json")
          package = json.loads(path.read_text())
          package["version"] = version
          path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n")
          replacements = {
              "README.md": (
                  "Release order is canonical-to-downstream: update `scnet-hpc/VERSION` first; its CI then\n"
                  "synchronizes the skill and version into `dsh-scnet` and `codex-scnet-hpc`. Publish the matching\n"
                  "`dsh-scnet` npm package only after that downstream change is reviewed.\n\n"
                  "For a synchronized release, run the package validation on `main`, then trigger the repository's\n"
                  "`Publish DSH-SCNet` workflow with the exact current version from `package.json`. The\n"
                  "workflow verifies the package/Skill version match, runs validation, creates the tarball, publishes\n"
                  "stable releases with the `latest` tag, and creates the matching Git tag. Do not bump only\n"
                  "`package.json`: `skills/scnet-hpc/VERSION`, the package version, and both README release markers\n"
                  "must stay aligned.",
                  "Release order is canonical-to-downstream: update the canonical `VERSION` and release highlights "
                  "once. CI synchronizes both distribution repositories. After each synchronized pull request "
                  "passes validation, the workflow merges it automatically. "
                  "The resulting `main` push validates and packs the bundle, publishes the npm package with the "
                  "appropriate `latest` or `next` tag, and creates the matching Git tag and GitHub Release. "
                  "Do not bump only `package.json`: the canonical `VERSION` remains the release source of truth.",
              ),
              "README_CN.md": (
                  "发布顺序也是从 canonical 向下游流转：先在 `scnet-hpc` 修改并发布 `VERSION`，其 CI\n"
                  "再把 Skill 内容和版本同步到 `dsh-scnet` 与 `codex-scnet-hpc`。下游变更审核通过后，\n"
                  "才能发布对应版本的 `dsh-scnet` npm 包。\n\n"
                  "下游同步合并到 `main` 后，先运行本地校验，再手动触发仓库的 `Publish DSH-SCNet` workflow，\n"
                  "输入 `package.json` 中的当前版本。workflow 会校验 package 与 Skill\n"
                  "版本一致，执行验证、生成 tarball、以稳定版 `latest` 标签发布，并创建对应 Git tag。\n"
                  "不要只修改 `package.json`；`skills/scnet-hpc/VERSION`、package 版本和两份 README 的版本\n"
                  "标记必须保持一致。",
                  "发布只需在 canonical 仓库更新一次 `VERSION` 与版本亮点，CI 会同步两个分发仓库。"
                  "下游同步 PR 校验通过后自动合并；合并产生的 `main` push 会校验并打包 bundle，"
                  "以对应的 `latest` 或 `next` 标签发布 npm package，并创建匹配的 Git tag 与 GitHub "
                  "Release。不要只修改 `package.json`；canonical `VERSION` 仍是唯一版本来源。",
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          PY
          python3 .github/scripts/release_docs.py \
            --version-file skills/scnet-hpc/VERSION

      - name: Install dsh-scnet dependencies
        working-directory: dsh-scnet
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate dsh-scnet
        working-directory: dsh-scnet
        run: |
          npm run validate
          python3 .github/scripts/release_docs.py --check \
            --version-file skills/scnet-hpc/VERSION
          test -f .github/workflows/publish.yml
          test ! -e .github/workflows/prepare-release.yml

      - name: Verify canonical backend entrypoints
        working-directory: scnet-hpc
        run: |
          test -x scripts/setup.sh
          bash -n scripts/setup.sh scripts/*.sh
          python3 -m py_compile scripts/*.py scripts/scnet_sdk/*.py scripts/scnet_backends/*.py

      - name: Open sync pull request
        id: sync-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DSH_SCNET_PAT }}
          path: dsh-scnet
          commit-message: "Sync scnet-hpc updates"
          branch: sync/scnet-hpc
          delete-branch: true
          title: "Sync scnet-hpc updates"
          body: |
            自动同步自 lql341/scnet-hpc@${{ github.sha }}。

            同步内容、发布文档和自动发布 workflow 会先经过目标仓库校验；
            必需检查通过后，本 workflow 将自动合并该 PR。

      - name: Validate and merge sync pull request
        if: steps.sync-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DSH_SCNET_PAT }}
          PR_URL: ${{ steps.sync-pr.outputs.pull-request-url }}
        run: |
          gh pr checks "$PR_URL" --required --watch --interval 10
          gh pr merge "$PR_URL" --merge --delete-branch

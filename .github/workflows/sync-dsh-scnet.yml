name: Sync dsh-scnet

on:
  push:
    branches:
      - main
    paths:
      - "SKILL.md"
      - "clusters/**"
      - "references/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scnet-hpc
        uses: actions/checkout@v4
        with:
          path: scnet-hpc
          fetch-depth: 0

      - name: Checkout dsh-scnet
        uses: actions/checkout@v4
        with:
          repository: lql341/dsh-scnet
          path: dsh-scnet
          token: ${{ secrets.DSH_SCNET_PAT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync skill content into dsh-scnet
        working-directory: dsh-scnet
        run: |
          chmod +x sync.sh
          ./sync.sh --src ../scnet-hpc

      - name: Install dsh-scnet dependencies
        working-directory: dsh-scnet
        run: npm install --no-package-lock

      - name: Validate dsh-scnet
        working-directory: dsh-scnet
        run: |
          node --check index.mjs
          for script in skills/scnet-hpc/scripts/*.sh; do
            bash -n "$script"
          done
          npm pack --dry-run

      - name: Open sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DSH_SCNET_PAT }}
          path: dsh-scnet
          commit-message: "Sync scnet-hpc updates"
          branch: sync/scnet-hpc
          delete-branch: true
          title: "Sync scnet-hpc updates"
          body: |
            自动同步自 lql341/scnet-hpc@${{ github.sha }}。

            请重点检查：
            - skill 内容是否有工具参数变化
            - 是否需要在 dsh-scnet 的 index.mjs 中新增或调整工具
            - npm 版本是否需要 bump

name: Sync dsh-scnet

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "SKILL.md"
      - "clusters/**"
      - "references/**"
      - "scripts/**"
      - ".github/workflows/sync-dsh-scnet.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scnet-hpc
        uses: actions/checkout@v7
        with:
          path: scnet-hpc
          fetch-depth: 0

      - name: Checkout dsh-scnet
        uses: actions/checkout@v7
        with:
          repository: lql341/dsh-scnet
          path: dsh-scnet
          token: ${{ secrets.DSH_SCNET_PAT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync skill content into dsh-scnet
        working-directory: dsh-scnet
        run: |
          chmod +x sync.sh
          ./sync.sh --src ../scnet-hpc

      - name: Update downstream sync manifest
        working-directory: dsh-scnet
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("sync.sh")
          text = path.read_text()
          required = (
              "setup.sh",
              "scnet.py",
              "scnet_config.py",
              "scnet_credentials.py",
              "scnet_version.py",
          )
          match = re.search(r"(for f in [^;\n]+)(; do)", text)
          if match:
              missing = [name for name in required if name not in match.group(1)]
              if missing:
                  replacement = match.group(1) + " " + " ".join(missing) + match.group(2)
                  text = text[:match.start()] + replacement + text[match.end():]
          marker = 'chmod +x "$DST/scripts/"*.sh'
          additions = ""
          if 'cp -R "$SRC/scripts/scnet_backends"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_backends"\n'
                  'cp -R "$SRC/scripts/scnet_backends" "$DST/scripts/scnet_backends"\n'
              )
          if 'cp -R "$SRC/scripts/scnet_sdk"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_sdk"\n'
                  'cp -R "$SRC/scripts/scnet_sdk" "$DST/scripts/scnet_sdk"\n'
              )
          if marker in text and additions:
              text = text.replace(
                  marker,
                  additions + marker + '\nchmod +x "$DST/scripts/scnet.py"',
              )
          path.write_text(text)
          PY

      - name: Overlay canonical backend entrypoints
        working-directory: dsh-scnet
        run: |
          cp ../scnet-hpc/VERSION skills/scnet-hpc/VERSION
          dst=skills/scnet-hpc/scripts
          cp ../scnet-hpc/scripts/setup.sh "$dst/setup.sh"
          cp ../scnet-hpc/scripts/scnet.py "$dst/scnet.py"
          cp ../scnet-hpc/scripts/scnet_config.py "$dst/scnet_config.py"
          cp ../scnet-hpc/scripts/scnet_credentials.py "$dst/scnet_credentials.py"
          cp ../scnet-hpc/scripts/scnet_version.py "$dst/scnet_version.py"
          rm -rf "$dst/scnet_backends"
          cp -R ../scnet-hpc/scripts/scnet_backends "$dst/scnet_backends"
          rm -rf "$dst/scnet_sdk"
          cp -R ../scnet-hpc/scripts/scnet_sdk "$dst/scnet_sdk"
          chmod +x "$dst/setup.sh" "$dst/scnet.py"

      - name: Install dsh-scnet dependencies
        working-directory: dsh-scnet
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate dsh-scnet
        working-directory: dsh-scnet
        run: npm run validate

      - name: Verify canonical backend entrypoints
        working-directory: scnet-hpc
        run: |
          test -x scripts/setup.sh
          bash -n scripts/setup.sh scripts/*.sh
          python3 -m py_compile scripts/*.py scripts/scnet_sdk/*.py scripts/scnet_backends/*.py

      - name: Open sync pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DSH_SCNET_PAT }}
          path: dsh-scnet
          commit-message: "Sync scnet-hpc updates"
          branch: sync/scnet-hpc
          delete-branch: true
          title: "Sync scnet-hpc updates"
          body: |
            自动同步自 lql341/scnet-hpc@${{ github.sha }}。

            请重点检查：
            - skill 内容是否有工具参数变化
            - 是否需要在 dsh-scnet 的 index.mjs 中新增或调整工具
            - npm 版本是否需要 bump

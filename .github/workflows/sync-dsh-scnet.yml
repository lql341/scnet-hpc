name: Sync dsh-scnet

on:
  workflow_run:
    workflows: ["Validate skill"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-dsh-scnet
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scnet-hpc
        uses: actions/checkout@v7
        with:
          path: scnet-hpc
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout dsh-scnet
        uses: actions/checkout@v7
        with:
          repository: lql341/dsh-scnet
          path: dsh-scnet
          token: ${{ secrets.DSH_SCNET_PAT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync skill content into dsh-scnet
        working-directory: dsh-scnet
        run: |
          chmod +x sync.sh
          ./sync.sh --src ../scnet-hpc

      - name: Update downstream sync manifest
        working-directory: dsh-scnet
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("sync.sh")
          text = path.read_text()
          required = (
              "setup.sh",
              "scnet.py",
              "scnet_config.py",
              "scnet_credentials.py",
              "scnet_version.py",
          )
          match = re.search(r"(for f in [^;\n]+)(; do)", text)
          if match:
              missing = [name for name in required if name not in match.group(1)]
              if missing:
                  replacement = match.group(1) + " " + " ".join(missing) + match.group(2)
                  text = text[:match.start()] + replacement + text[match.end():]
          marker = 'chmod +x "$DST/scripts/"*.sh'
          additions = ""
          if 'cp -R "$SRC/scripts/scnet_backends"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_backends"\n'
                  'cp -R "$SRC/scripts/scnet_backends" "$DST/scripts/scnet_backends"\n'
              )
          if 'cp -R "$SRC/scripts/scnet_sdk"' not in text:
              additions += (
                  'rm -rf "$DST/scripts/scnet_sdk"\n'
                  'cp -R "$SRC/scripts/scnet_sdk" "$DST/scripts/scnet_sdk"\n'
              )
          if marker in text and additions:
              text = text.replace(
                  marker,
                  additions + marker + '\nchmod +x "$DST/scripts/scnet.py"',
              )
          attribute_sync = (
              'if [ -f "$SRC/.gitattributes" ]; then\n'
              '  cp "$SRC/.gitattributes" "$DST/../../.gitattributes"\n'
              'fi\n'
          )
          if 'cp "$SRC/.gitattributes"' not in text:
              text += '\n' + attribute_sync
          path.write_text(text)
          PY
          cp ../scnet-hpc/.gitattributes .gitattributes

      - name: Overlay canonical backend entrypoints
        working-directory: dsh-scnet
        run: |
          cp ../scnet-hpc/VERSION skills/scnet-hpc/VERSION
          dst=skills/scnet-hpc/scripts
          cp ../scnet-hpc/scripts/setup.sh "$dst/setup.sh"
          cp ../scnet-hpc/scripts/scnet.py "$dst/scnet.py"
          cp ../scnet-hpc/scripts/scnet_config.py "$dst/scnet_config.py"
          cp ../scnet-hpc/scripts/scnet_credentials.py "$dst/scnet_credentials.py"
          cp ../scnet-hpc/scripts/scnet_version.py "$dst/scnet_version.py"
          rm -rf "$dst/scnet_backends"
          cp -R ../scnet-hpc/scripts/scnet_backends "$dst/scnet_backends"
          rm -rf "$dst/scnet_sdk"
          cp -R ../scnet-hpc/scripts/scnet_sdk "$dst/scnet_sdk"
          chmod +x "$dst/setup.sh" "$dst/scnet.py"

      - name: Align package metadata with canonical version
        working-directory: dsh-scnet
        run: |
          cp ../scnet-hpc/CHANGELOG.md CHANGELOG.md
          cp ../scnet-hpc/RELEASE_HIGHLIGHTS.md RELEASE_HIGHLIGHTS.md
          cp ../scnet-hpc/RELEASE_HIGHLIGHTS_CN.md RELEASE_HIGHLIGHTS_CN.md
          mkdir -p .github/scripts
          cp ../scnet-hpc/.github/scripts/release_docs.py .github/scripts/release_docs.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = Path("../scnet-hpc/VERSION").read_text().strip()
          path = Path("package.json")
          package = json.loads(path.read_text())
          package["version"] = version
          path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n")
          PY
          python3 .github/scripts/release_docs.py \
            --version-file skills/scnet-hpc/VERSION
          python3 ../scnet-hpc/.github/scripts/onboarding_docs.py \
            --skill-dir skills/scnet-hpc

      - name: Install dsh-scnet dependencies
        working-directory: dsh-scnet
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate dsh-scnet
        working-directory: dsh-scnet
        run: |
          npm run validate
          python3 .github/scripts/release_docs.py --check \
            --version-file skills/scnet-hpc/VERSION
          test -f .github/workflows/publish.yml
          test ! -e .github/workflows/prepare-release.yml

      - name: Verify canonical backend entrypoints
        working-directory: scnet-hpc
        run: |
          test -x scripts/setup.sh
          bash -n scripts/setup.sh scripts/*.sh
          python3 -m py_compile scripts/*.py scripts/scnet_sdk/*.py scripts/scnet_backends/*.py

      - name: Open sync pull request
        id: sync-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DSH_SCNET_PAT }}
          path: dsh-scnet
          commit-message: "Sync scnet-hpc updates"
          branch: sync/scnet-hpc
          delete-branch: true
          title: "Sync scnet-hpc updates"
          body: |
            自动同步自 lql341/scnet-hpc@${{ github.event.workflow_run.head_sha || github.sha }}。

            同步内容、发布文档和自动发布 workflow 会先经过目标仓库校验；
            必需检查通过后，本 workflow 将自动合并该 PR。

      - name: Validate and merge sync pull request
        if: steps.sync-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DSH_SCNET_PAT }}
          PR_URL: ${{ steps.sync-pr.outputs.pull-request-url }}
        run: |
          for attempt in {1..12}; do
            if gh pr checks "$PR_URL" --required --watch --interval 10; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::required checks were not reported for $PR_URL"
              exit 1
            fi
            sleep 5
          done
          gh pr merge "$PR_URL" --merge --delete-branch

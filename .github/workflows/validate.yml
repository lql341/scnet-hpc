name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/*.py scripts/scnet_sdk/*.py scripts/scnet_backends/*.py

      - name: Validate version
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          test "$(python3 scripts/scnet.py --version)" = "scnet-hpc $(cat VERSION)"

      - name: Test job generation
        run: bash tests/test-new-job.sh

      - name: Test first-use setup entrypoint
        run: bash tests/test-setup.sh

      - name: Test backend routing
        run: python3 tests/test-backends.py

      - name: Check repository hygiene
        run: |
          git diff --check
          if git grep -nE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|(^|[[:space:]])(export[[:space:]]+)?(API_KEY|ACCESS_KEY|SECRET_KEY|TOKEN|PASSWORD)[[:space:]]*=[[:space:]]*[^<[:space:]]+' -- ':!*.md' ':!.github/**'; then
            echo "疑似凭据进入仓库" >&2
            exit 1
          fi
